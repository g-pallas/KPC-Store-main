databases:
  - name: kpc-store-db
    plan: free
    databaseName: kpc_store
    user: kpc_store_user

services:
  - type: web
    name: kpc-store-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /up
    envVars:
      - key: APP_NAME
        value: KPC Store
      - key: APP_ENV
        value: production
      - key: APP_KEY
        sync: false
      - key: APP_DEBUG
        value: false
      - key: APP_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: FRONTEND_URL_PATTERN
        sync: false
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: info
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: kpc-store-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: kpc-store-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: kpc-store-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: kpc-store-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: kpc-store-db
          property: password
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: FILESYSTEM_DISK
        value: public
